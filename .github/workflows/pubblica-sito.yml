# =====================================================================
#  Pubblica il sito  --  parte a ogni modifica su main (cioè a ogni
#  pull request unita) e si può lanciare a mano dalla scheda Actions.
#
#  0. Aggiorna il registro delle modifiche: per ogni PR unita con
#     un'etichetta di versione (correzione, contenuto, approvazione)
#     aggiunge la riga nel file .registro.tex dei documenti toccati
#     (scripts/registro.py, GUIDA.md sezione 5).
#  1. Compila tutti i documenti di Candidatura/, RTB/ e PB/.
#  2. Salva nel repository il registro e il PDF accanto a ogni .tex cambiato
#     (es. RTB/verbali/interni/VI-2026-11-03.pdf), con un commit del bot.
#     Per poterlo fare su main protetto serve la chiave CHIAVE_PDF:
#     GUIDA.md, sezione 8. Senza chiave il sito si pubblica lo stesso,
#     ma i PDF accanto ai .tex non vengono salvati (compare un avviso).
#  3. Pubblica i PDF su GitHub Pages: https://git-push-team.github.io/docs/
# =====================================================================
name: Pubblica il sito

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write       # per salvare registro e PDF nel repository
  pages: write
  id-token: write
  pull-requests: write  # il bot del registro aggiorna il suo commento nella PR
  issues: read          # chi ha messo l'etichetta "approvazione"

# Un'esecuzione alla volta: due merge ravvicinati non si pestano i piedi
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  compila:
    name: Compila tutti i documenti
    runs-on: ubuntu-24.04     # fissata di proposito, vedi anteprima-pr.yml
    timeout-minutes: 30
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v7
        with:
          ref: main               # l'ultima versione di main
          fetch-depth: 0          # serve la storia per capire quali PDF sono cambiati
          # con la chiave il bot può salvare i PDF su main protetto;
          # se il segreto non esiste si usa il token normale
          ssh-key: ${{ secrets.CHIAVE_PDF }}

      # chi è chi (username GitHub -> chiave) e il Responsabile di ogni
      # sprint: dal file di pianificazione del repository .github
      - name: Scarica la pianificazione del gruppo
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/.github
          path: .gestione
          sparse-checkout: gestione/pianificazione.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Aggiorna il registro delle modifiche
        continue-on-error: true   # un problema del registro non ferma il sito
        env:
          GH_TOKEN: ${{ github.token }}
          PIANIFICAZIONE: .gestione/gestione/pianificazione.toml
        run: python3 scripts/registro.py aggiorna

      - name: Installa LaTeX
        uses: ./.github/actions/setup-latex

      - name: Compila, prepara il sito e i PDF accanto ai sorgenti
        id: build
        run: python3 scripts/build.py --pdf-accanto

      # due commit possibili: quello del registro (passo "Aggiorna il
      # registro") e quello dei PDF. Si salvano insieme, con un solo push.
      - name: Salva registro e PDF nel repository
        env:
          HA_CHIAVE: ${{ secrets.CHIAVE_PDF != '' }}
          MESSAGGIO: ${{ steps.build.outputs.messaggio }}   # contiene [skip ci]
          PDF_AGGIORNATI: ${{ steps.build.outputs.pdf_aggiornati }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$PDF_AGGIORNATI" ] && [ "$PDF_AGGIORNATI" != "0" ]; then
            git commit --quiet -m "$MESSAGGIO"
          fi
          if [ -z "$(git rev-list origin/main..HEAD)" ]; then
            echo "Niente da salvare: registro e PDF sono già aggiornati."
            exit 0
          fi
          if git push origin HEAD:main; then
            echo "Registro e PDF salvati nel repository."
          elif [ "$HA_CHIAVE" != "true" ]; then
            echo "::warning::Registro e PDF non salvati: main è protetto e manca la chiave CHIAVE_PDF (GUIDA.md, sezione 8). Il sito viene pubblicato lo stesso; le righe del registro verranno salvate al prossimo merge."
          else
            echo "::warning::Registro e PDF non salvati: main è cambiato durante la compilazione oppure la chiave non può scavalcare la protezione (GUIDA.md, sezione 8). Il prossimo merge li salverà. Il sito viene pubblicato lo stesso."
          fi

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  pubblica:
    name: Pubblica su GitHub Pages
    needs: compila
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v5
